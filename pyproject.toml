[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pra"]  # Specify the package explicitly

[project]
name = "PeerReviewAgent"
version = "1.0"
description = "Peer Review Agent"
authors = [{ name = "AmazeVR" }]
requires-python = ">=3"
dependencies = [
    "numpy",
    "tqdm",
    "hydra-core",
    "click",
    "fastapi",
    "uvicorn",
    "pytz",
    "omegaconf",
    "pandas",
    "requests",
    "rich",
    "pre-commit",
    "openai",
    "nvitop",
]
